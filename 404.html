<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#111513">
    <title>Page not found — Applied Market Research Portfolio</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111513;
        --surface: #171c19;
        --text: #f0ede4;
        --muted: #a7aaa3;
        --border: #343a35;
        --accent: #92a49a;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 1.25rem;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      main {
        width: min(100%, 48rem);
        padding: clamp(1.5rem, 5vw, 4rem);
        border: 1px solid var(--border);
        background: var(--surface);
      }

      .eyebrow {
        margin: 0 0 clamp(4rem, 12vw, 7rem);
        color: var(--accent);
        font-size: 0.68rem;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 1.25rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.8rem, 9vw, 5.5rem);
        font-weight: 400;
        line-height: 0.98;
        letter-spacing: -0.04em;
      }

      p {
        max-width: 34rem;
        margin: 0 0 2rem;
        color: var(--muted);
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        min-height: 3rem;
        align-items: center;
        padding: 0.7rem 1rem;
        border: 1px solid var(--text);
        background: var(--text);
        color: var(--bg);
        font-size: 0.78rem;
        text-decoration: none;
      }

      a:hover {
        background: transparent;
        color: var(--text);
      }

      a:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Applied Market Research Portfolio · 404</p>
      <h1>Page not found<br><span lang="es">Página no encontrada</span></h1>
      <p>The requested page is not available.<br><span lang="es">La página solicitada no está disponible.</span></p>
      <a href="./index.html">Return home&nbsp; / &nbsp;<span lang="es">Volver al inicio</span></a>
    </main>
  </body>
</html>
